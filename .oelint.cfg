# oelint-adv defaults for this layer. Auto-loaded when oelint-adv runs with this
# directory as the working directory (see contrib/oelint/run-oelint.sh).
#
# Keep exceptions inline as '# nooelint: <rule.id>' comments next to each finding
# so new recipes are always fully linted and every exception is documented in
# place. Add a layer-wide 'suppress' below only for a rule that provably can never
# apply to this layer (e.g. oelint.var.bbclassextend for a target-only layer that
# ships no cross-compilable libraries).
[oelint]
release = wrynose
